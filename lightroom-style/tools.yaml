# Project tool catalog; read by the agent and checked by tools/build_release.py.
# This is not an MCP server configuration or a runtime permission grant.
schema_version: 1
host: codex
host_tools:
  - name: exec_command
    purpose: Run local Python helpers and read task files through the host shell.
  - name: write_stdin
    purpose: Poll or interact with a shell session returned by exec_command.
  - name: apply_patch
    purpose: Write task notes and structured configuration files.
  - name: view_image
    purpose: Inspect reference images and Lightroom-rendered exports.
cli_helpers:
  - id: setup
    entrypoint: scripts/setup_lightroom.py
    purpose: Install missing bundled plugin files on Windows; never claim UI loading.
    guide: references/bridge.md
  - id: probe
    entrypoint: scripts/lightroom_probe.py
    purpose: Request fresh read-only Lightroom diagnostics.
    guide: references/bridge.md
  - id: lightroom
    entrypoint: scripts/lightroom_client.py
    purpose: Import, read, copy, apply tone/color/grain, curve, mask-read/create/adjust, export, and query request status.
    guide: references/bridge.md
  - id: round
    entrypoint: scripts/lightroom_round.py
    purpose: Execute planned guarded groups, independently read back, and export once; return compact evidence for visual review.
    guide: references/rounds.md
  - id: analyze
    entrypoint: scripts/analyze_images.py
    purpose: Read RGB/brightness histograms and tone-conditioned hue distributions from explicit rendered images without modifying pixels or using the desktop.
    guide: references/analysis.md
  - id: analyze_tones
    entrypoint: scripts/analyze_tone_regions.py
    purpose: Compare manually chosen subject/bright/dark regions without editing pixels; distinguish tonal separation from color saturation.
    guide: references/analysis.md
optional_capabilities:
  - id: desktop_control
    purpose: Read native Develop histogram and RGB/Lab samples, load or enable the plugin, and operate unsupported native controls.
    requirement: A host-provided tool with verified readable native Lightroom UI.
    binding: Discover the actual tool name; no universal desktop tool is registered here.
    fallback: Distinguish unavailable control from app permission denial; follow bridge.md startup recovery before requesting manual action.
